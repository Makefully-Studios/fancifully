<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fancifully Demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2a241c;
      }
      #app {
        height: 100%;
      }
      .demo-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        display: flex;
        gap: 0.5rem;
        align-items: center;
        padding: 0.4rem 0.75rem;
        background: rgba(0, 0, 0, 0.55);
        color: #f5efe6;
        font: 14px/1.2 system-ui, sans-serif;
      }
      .demo-bar select,
      .demo-bar button {
        font: inherit;
      }
      #app {
        padding-top: 2.25rem;
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <strong>Fancifully</strong>
      <label>
        Layout
        <select id="layoutMode">
          <option value="auto">auto</option>
          <option value="single">single</option>
          <option value="two-page">two-page</option>
        </select>
      </label>
      <span id="status"></span>
    </div>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
